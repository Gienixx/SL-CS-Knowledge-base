<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <link
    rel="canonical"
    href="./KB.html"
  >
  <title>Opening Knowledge Base</title>
  <link rel="stylesheet" href="./styles/site-theme.css?v=1">
  <script src="./scripts/site-theme.js?v=1"></script>
</head>
<body>
  <p>
    This article view has moved to the
    <a id="knowledgeBaseRedirect" href="./KB.html">Knowledge Base</a>.
  </p>

  <script>
    const parameters = new URLSearchParams(window.location.search)
    const articleId =
      parameters.get('id') || parameters.get('article') || ''
    const target = new URL('./KB.html', window.location.href)

    if (articleId) {
      target.searchParams.set('article', articleId)
    }

    document.getElementById('knowledgeBaseRedirect').href = target.href
    window.location.replace(target.href)
  </script>
</body>
</html>
