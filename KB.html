<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge base</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css">
<style>
  :root{
    --page-bg:#F1EFE8;
    --panel-bg:#FFFFFF;
    --border:#E4E1D6;
    --border-strong:#C9C6B9;
    --text-primary:#211F1C;
    --text-secondary:#6F6D64;
    --text-muted:#9B988D;
    --pill-bg:#EEEDFE;
    --pill-text:#3C3489;
    --cashout-bg:#E4F1EC;
    --cashout-text:#2E7D6B;
    --link-bg:#FBEDDA;
    --link-text:#925F17;
    --logo-bg:#BA7517;
    --logo-text:#FAEEDA;
    --line:var(--border);
    --text:var(--text-primary);
    --muted:var(--text-secondary);
    --gold:#BA7517;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    min-height:100vh;
    margin:0;
    padding:24px;
    background:var(--page-bg);
    color:var(--text-primary);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  button,input{font:inherit}
  .header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    max-width:1440px;
    margin:0 auto 20px;
    gap:16px;
  }
  .brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}
  .logo{
    display:flex;
    width:32px;
    height:32px;
    align-items:center;
    justify-content:center;
    border-radius:8px;
    background:var(--logo-bg);
    color:var(--logo-text);
    font-size:15px;
    font-weight:500;
  }
  .brand-name{font-size:16px;font-weight:500}
  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:4px;
    padding:7px 14px;
    border:.5px solid var(--border);
    border-radius:8px;
    background:var(--panel-bg);
    color:var(--text-primary);
    font-size:13px;
    text-decoration:none;
  }
  .back-btn:hover{border-color:var(--border-strong)}
  .back-btn:focus-visible,.search-wrap input:focus-visible,.filters button:focus-visible,.list-item:focus-visible,.detail-action:focus-visible,.back-to-top:focus-visible{
    outline:2px solid var(--pill-text);
    outline-offset:2px;
  }
  .layout{
    display:grid;
    grid-template-columns:260px minmax(0,1fr);
    align-items:start;
    gap:20px;
    max-width:1440px;
    margin:0 auto;
  }
  .sidebar,.detail{
    border:.5px solid var(--border);
    border-radius:12px;
    background:var(--panel-bg);
  }
  .sidebar{padding:14px}
  .search-wrap{position:relative;margin-bottom:12px}
  .search-wrap i{
    position:absolute;
    top:50%;
    left:10px;
    transform:translateY(-50%);
    color:var(--text-muted);
    font-size:15px;
    pointer-events:none;
  }
  .search-wrap input{
    width:100%;
    padding:8px 10px 8px 32px;
    border:.5px solid var(--border);
    border-radius:8px;
    background:var(--panel-bg);
    color:var(--text-primary);
    font-size:14px;
  }
  .search-wrap input::placeholder{color:var(--text-muted)}
  .filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .filters button{
    padding:4px 10px;
    border:.5px solid var(--border);
    border-radius:20px;
    background:transparent;
    color:var(--text-secondary);
    font-size:12px;
    cursor:pointer;
  }
  .filters button:hover,.filters button.active{
    border-color:var(--border-strong);
    background:var(--page-bg);
    color:var(--text-primary);
  }
  .list{display:flex;flex-direction:column;gap:2px}
  .list-item{
    width:100%;
    padding:10px 12px;
    border:0;
    border-radius:8px;
    background:transparent;
    color:inherit;
    text-align:left;
    cursor:pointer;
  }
  .list-item:hover{background:var(--page-bg)}
  .list-item.selected{background:var(--pill-bg)}
  .list-item-title{
    margin-bottom:2px;
    color:var(--text-primary);
    font-size:13.5px;
    font-weight:500;
    line-height:1.4;
  }
  .list-item.selected .list-item-title{color:var(--pill-text)}
  .list-item-meta{color:var(--text-muted);font-size:12px;line-height:1.4}
  .empty-state{padding:16px 4px;color:var(--text-muted);font-size:13px;line-height:1.5}
  .empty-state.detail-empty{padding:0}
  .detail{
    position:static;
    min-height:260px;
    padding:24px 28px;
  }
  .tag-pill{
    display:inline-block;
    margin-bottom:10px;
    padding:2px 10px;
    border-radius:12px;
    background:var(--pill-bg);
    color:var(--pill-text);
    font-size:12px;
  }
  .tag-pill.cashouts{background:var(--cashout-bg);color:var(--cashout-text)}
  .tag-pill.links{background:var(--link-bg);color:var(--link-text)}
  .detail h1{
    margin:0 0 8px;
    color:var(--text-primary);
    font-size:22px;
    font-weight:500;
    line-height:1.3;
  }
  .byline{
    display:flex;
    align-items:center;
    gap:4px;
    margin-bottom:16px;
    color:var(--text-muted);
    font-size:13px;
  }
  .detail-body{padding-top:16px;border-top:.5px solid var(--border)}
  .detail-body p{
    margin:0 0 18px;
    color:var(--text-primary);
    font-size:16px;
    line-height:1.7;
  }
  .article-cover{
    display:block;
    width:100%;
    max-height:390px;
    margin:2px 0 24px;
    border:.5px solid var(--border);
    border-radius:10px;
    object-fit:cover;
  }
  .article-dek{
    margin:0 0 22px;
    color:var(--text-secondary);
    font-size:15px;
    line-height:1.65;
  }
  .article-body{
    padding-top:18px;
    border-top:.5px solid var(--border);
    color:var(--text-primary);
    font-size:15px;
    line-height:1.75;
  }
  .article-body .section,.article-body .step-card,.article-body .callout-card,.article-body .table-card{
    margin:0 0 28px;
    padding:0;
    border:0;
    border-radius:0;
    background:transparent;
    box-shadow:none;
    overflow:visible;
  }
  .article-body h2,.article-body .section-title,.article-body .step-title,.article-body .table-title,.article-body .callout-card-title{
    margin:32px 0 12px;
    color:var(--text-primary);
    font-size:19px;
    font-weight:600;
    letter-spacing:-.2px;
  }
  .article-body > :first-child h2,.article-body > h2:first-child{margin-top:0}
  .article-body h3{margin:24px 0 10px;font-size:16px;font-weight:600}
  .article-body p{margin:0 0 16px;color:var(--text-primary)}
  .article-body ul,.article-body ol{margin:0 0 16px;padding-left:22px}
  .article-body li{margin-bottom:8px}
  .article-body .callout-card{
    margin:20px 0;
    padding:16px 18px;
    border-radius:12px;
    background:var(--cashout-bg);
    color:var(--cashout-text);
    font-size:13.5px;
    line-height:1.6;
  }
  .article-body .callout-card-title{
    margin:0 0 5px;
    color:var(--cashout-text);
    font-size:13.5px;
    font-weight:700;
  }
  .article-body table{width:100%;margin:16px 0;border-collapse:collapse}
  .article-body th,.article-body td{
    padding:11px 12px;
    border:1px solid var(--border);
    text-align:left;
    vertical-align:top;
  }
  .article-body th{background:var(--link-bg);font-size:13px}
  .article-body img{max-width:100%;height:auto;border-radius:10px}
  .detail-action{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:8px 13px;
    border:.5px solid var(--border-strong);
    border-radius:8px;
    background:var(--panel-bg);
    color:var(--text-primary);
    font-size:13px;
    font-weight:500;
    text-decoration:none;
  }
  .detail-action:hover{background:var(--page-bg)}
  .load-error{color:#A13D2D}
  .back-to-top{
    position:fixed;
    right:24px;
    bottom:24px;
    z-index:10;
    display:flex;
    width:46px;
    height:46px;
    align-items:center;
    justify-content:center;
    border:1px solid #D8AE69;
    border-radius:50%;
    background:linear-gradient(145deg,#FFFFFF,#F7EBD7);
    color:var(--logo-bg);
    box-shadow:0 8px 22px rgba(73,53,25,.18),0 2px 5px rgba(73,53,25,.12);
    font-size:22px;
    font-weight:700;
    line-height:1;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transform:translateY(8px);
    transition:opacity .18s ease,transform .18s ease,background .18s ease,color .18s ease,box-shadow .18s ease;
  }
  .back-to-top.visible{opacity:1;pointer-events:auto;transform:translateY(0)}
  .back-to-top.visible:hover{
    transform:translateY(-2px);
    background:var(--logo-bg);
    color:var(--logo-text);
    box-shadow:0 10px 26px rgba(73,53,25,.24),0 3px 7px rgba(73,53,25,.14);
  }
  .back-to-top.visible:active{transform:translateY(0)}
  .back-to-top-icon{display:block;transform:translateY(-1px)}
  [hidden]{display:none!important}
  @media(max-width:720px){
    body{padding:18px}
    .layout{grid-template-columns:1fr}
    .detail{min-height:220px;padding:22px}
    .back-to-top{right:18px;bottom:18px}
  }
  @media(max-width:420px){
    .header{align-items:flex-start}
    .brand-name{font-size:15px}
    .back-btn{padding:7px 10px}
  }
  @media(prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .back-to-top{transition:none}
  }
</style>
  <link rel="stylesheet" href="./styles/site-theme.css?v=1">
  <script src="./scripts/site-theme.js?v=1"></script>
</head>
<body>
<header class="header" id="pageTop">
  <a class="brand" href="./KB.html" aria-label="Knowledge base home">
    <span class="logo">S</span>
    <span class="brand-name">Knowledge base</span>
  </a>
  <a class="back-btn" href="./home.html"><i class="ti ti-arrow-left" aria-hidden="true"></i>Back to home</a>
</header>

<main class="layout">
  <section class="sidebar" aria-label="Browse knowledge base">
    <div class="search-wrap">
      <i class="ti ti-search" aria-hidden="true"></i>
      <label for="kbSearch" hidden>Search articles</label>
      <input id="kbSearch" type="search" placeholder="Search articles" autocomplete="off">
    </div>
    <div id="kbFilters" class="filters" aria-label="Article categories"></div>
    <div id="kbList" class="list" aria-live="polite">
      <div class="empty-state">Loading articles…</div>
    </div>
  </section>

  <article id="kbDetail" class="detail">
    <div class="empty-state detail-empty">Loading article details…</div>
  </article>
</main>

<button id="backToTop" class="back-to-top" type="button" aria-label="Back to top" title="Back to top">
  <span class="back-to-top-icon" aria-hidden="true">↑</span>
</button>

<script type="module" src="./scripts/kb.js?v=9"></script>
<script type="module" src="./scripts/auth-guard.js"></script>
</body>
</html>
