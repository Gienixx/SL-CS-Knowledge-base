<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="./styles/site-theme.css?v=5">

<title>User Profile</title>
<style>
  :root{
    --bg:#0b0b16;
    --panel:#12121f;
    --panel-alt:#161626;
    --border:#26263c;
    --header:#1a1a2e;
    --purple:#5b4fe0;
    --purple-light:#8b7ff5;
    --text:#e6e6f0;
    --text-dim:#9494ad;
    --yellow:#f0c419;
    --orange:#f2994a;
    --red:#ff5577;
    --green:#3ddc84;
    --blue:#5b9df0;
    --input-bg:#0e0e1c;
    --map-bg:#e8eaef;
    --map-text:#888;
    --button-text:#fff;
    --button-dark-text:#1a1a1a;
    --pink:#ff2e63;
    --pink-border:#7449dd;
  }
  html[data-site-theme="light"]{
    --bg:#f7f7ff;
    --panel:#f1f0ff;
    --panel-alt:#e9e8fa;
    --border:#c9c8e5;
    --header:#deddf1;
    --purple:#5b568d;
    --purple-light:#7a76a8;
    --text:#171632;
    --text-dim:#5f5d7b;
    --yellow:#f0c419;
    --blue:#4d5e9e;
    --input-bg:#fbfaff;
    --map-bg:#e9e9f5;
    --map-text:#6f6d86;
    --button-text:#fff;
    --button-dark-text:#1a1a1a;
    --pink:#d62e63;
    --pink-border:#8a78c7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size:13px;
  }
  .topbar{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--header);
    padding:10px 14px;
    border-bottom:1px solid var(--border);
  }
  .topbar input{
    flex:1;
    background:var(--input-bg);
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:8px 12px;
    border-radius:6px;
    font-size:12px;
  }
  .btn{
    border:none;
    padding:8px 16px;
    border-radius:6px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn-purple{ background:var(--purple); color:var(--button-text); }
  .btn-outline{ background:transparent; border:1px solid var(--purple-light); color:var(--purple-light); }
  .btn-yellow{ background:var(--yellow); color:var(--button-dark-text); }

  .user-summary{
    display:grid;
    grid-template-columns:minmax(400px,500px) minmax(0,1fr);
    gap:20px;
    align-items:stretch;
    margin:12px 16px 0;
    padding:16px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;
  }
  .user-summary-placeholder{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:280px;
    overflow:hidden;
    border:1px solid var(--border);
    border-radius:7px;
    background:var(--panel-alt);
    color:var(--text-dim);
    font-size:11px;
    text-align:center;
  }
  .verification-image{ display:block; width:100%; height:280px; object-fit:contain; }
  .verification-image-control{
    position:absolute;
    top:50%;
    width:28px;
    height:36px;
    transform:translateY(-50%);
    border:1px solid var(--border);
    border-radius:5px;
    background:color-mix(in srgb,var(--panel) 82%,transparent);
    color:var(--text);
    cursor:pointer;
    font-size:20px;
    line-height:1;
    z-index:1;
  }
  .verification-image-control:hover{ background:var(--panel); }
  .verification-image-control.previous{ left:8px; }
  .verification-image-control.next{ right:8px; }
  .verification-image-indicator{
    position:absolute;
    right:10px;
    bottom:8px;
    padding:3px 7px;
    border:1px solid var(--border);
    border-radius:10px;
    background:color-mix(in srgb,var(--panel) 82%,transparent);
    color:var(--text-dim);
    font-size:10px;
  }
  .user-summary-details{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:10px 18px;
    align-content:center;
  }
  .user-summary-field{ min-width:0; }
  .user-summary-label{
    display:block;
    margin-bottom:3px;
    color:var(--text-dim);
    font-size:10px;
    letter-spacing:.04em;
    text-transform:uppercase;
  }
  .user-summary-value{
    display:block;
    overflow-wrap:anywhere;
    color:var(--text);
    font-size:12px;
    font-weight:600;
  }
  .user-summary-value.is-positive{ color:var(--green); }
  @media (max-width:700px){
    .user-summary{ grid-template-columns:1fr; }
    .user-summary-placeholder{ min-height:240px; }
    .verification-image{ height:240px; }
    .user-summary-details{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  }
  @media (max-width:420px){
    .user-summary{ margin-left:10px; margin-right:10px; }
    .user-summary-details{ grid-template-columns:1fr; }
    .user-summary-placeholder{ min-height:220px; }
    .verification-image{ height:220px; }
  }

  .tabbar{
    display:flex;
    align-items:center;
    gap:4px;
    margin:12px 16px 0;
    background:var(--panel);
    padding:8px 14px;
    border:1px solid var(--border);
    border-radius:8px;
    overflow-x:auto;
  }
  .tab{
    display:flex;
    align-items:center;
    gap:6px;
    background:transparent;
    border:none;
    color:var(--text-dim);
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
    font-size:12.5px;
    white-space:nowrap;
    transition: background .15s, color .15s;
  }
  .tab:hover{ background:var(--panel-alt); color:var(--text); }
  .tab.active{ background:var(--purple); color:var(--button-text); }
  .tab-events{ position:relative; }
  .tab-notification{
    position:absolute;
    top:5px;
    right:5px;
    min-width:16px;
    height:16px;
    padding:0 3px;
    border-radius:50%;
    background:#ef3340;
    color:#fff;
    font-size:10px;
    font-weight:700;
    line-height:16px;
    text-align:center;
    box-shadow:0 0 0 2px var(--panel);
  }
  .tab .key{
    background:rgba(255,255,255,0.15);
    border-radius:4px;
    padding:1px 6px;
    font-size:10px;
    font-weight:700;
  }
  .cashout-action{
    width:58px;
    height:28px;
    border:1px solid var(--border);
    border-radius:4px;
    padding:4px 6px;
    background:var(--panel-alt);
    color:var(--text-dim);
    font:inherit;
    font-size:11px;
    white-space:nowrap;
  }
  .cashout-frame{ width:100%; min-width:0; overflow:hidden; border:1px solid var(--border); border-radius:6px; background:var(--panel); }
  .cashout-split{ display:flex; width:100%; min-width:0; }
  .cashout-data-panel{ min-width:0; flex:1 1 auto; }
  .cashout-actions-panel{ flex:0 0 396px; border-left:1px solid var(--border); background:var(--panel); }
  .cashout-data-scroll,
  .cashout-actions-scroll{ height:330px; overflow:auto; }
  .cashout-data-scroll{ overflow-y:scroll; scrollbar-width:none; }
  .cashout-data-scroll::-webkit-scrollbar{ height:0; width:0; }
  .cashout-actions-scroll{ overflow-x:hidden; }
  .cashout-split table{ border-collapse:separate; border-spacing:0; }
  .cashout-split th,
  .cashout-split td{ height:42px; vertical-align:middle; }
  .cashout-actions-table{ width:396px; table-layout:fixed; }
  .cashout-actions-table th,
  .cashout-actions-table td{ width:66px; min-width:66px; max-width:66px; padding:6px 4px; text-align:center; }
  .cashout-actions-table th{ background:var(--header); }
  .cashout-actions-table td{ background:var(--panel); border-left:1px solid var(--border); }
  .cashout-horizontal-rail{ height:16px; width:100%; background:var(--panel-alt); border-top:1px solid var(--border); overflow:hidden; cursor:pointer; }
  .cashout-horizontal-thumb{ height:100%; width:20%; min-width:24px; border-radius:8px; background:var(--text-dim); opacity:.65; }
  .cashout-action.is-enabled{
    background:var(--purple);
    border-color:var(--purple-light);
    color:var(--button-text);
  }
  .cashout-action:disabled{ opacity:.55; cursor:not-allowed; }
  th[data-column-key]{ cursor:grab; user-select:none; }
  th[data-column-key]:active{ cursor:grabbing; }
  th.column-dragging{ opacity:.45; }
  th.column-drop-before{ box-shadow:inset 3px 0 0 var(--purple-light); }
  th.column-drop-after{ box-shadow:inset -3px 0 0 var(--purple-light); }
  .tab.active .key{ background:rgba(255,255,255,0.3); }

  .content{
    display:flex;
    flex-direction:column;
    gap:16px;
    padding:16px;
  }

  .val-green{ color:var(--green); }
  .val-red{ color:var(--red); }
  .val-yellow{ color:var(--yellow); }
  .val-blue{ color:var(--blue); }

  .action-btn{
    display:block;
    width:100%;
    text-align:center;
    border:none;
    padding:12px;
    border-radius:6px;
    margin-bottom:10px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    color:var(--button-text);
    max-width:340px;
  }
  .ab-yellow{ background:var(--yellow); color:var(--button-dark-text); }
  .ab-purple{ background:var(--purple); color:var(--button-text); }
  .ab-pink{ background:var(--pink); color:var(--button-text); }

  /* Main panel */
  .main{
    flex:1;
    min-width:0;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;
    padding:16px;
  }
  .main h2{
    margin:0 0 12px 0;
    font-size:15px;
  }
  
  /* Grouped profile information */
.info-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));
  gap:14px;
  margin-bottom:18px;
}

.info-card{
  min-width:0;
  background:var(--panel-alt);
  border:1px solid var(--border);
  border-radius:8px;
  overflow:hidden;
}

.survey-session-summary .info-list{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
}

.survey-session-summary .info-row{
  display:flex;
  flex-direction:column;
  gap:3px;
  padding:7px 10px;
  border-right:1px solid var(--border);
}

.survey-session-summary .info-row:nth-child(4n){ border-right:none; }

.compact-metric-card .info-list{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); }

.compact-metric-card .info-row:nth-child(4n){ border-right:none; }

.compact-metric-card .info-value{ font-size:11px; }

.surveys-sessions-content .group-section-body{
  max-height:60vh;
  overflow:auto;
}
.compact-tab-content .group-section-body{ max-height:60vh; overflow:auto; }
.table-content-scroll .group-section-body{ max-height:calc(100vh - 300px); overflow:auto; }
.table-content-scroll .group-section-body .table-scroll{ overflow:auto; max-height:100%; }
.table-content-scroll thead th{ position:sticky; top:0; z-index:1; }
.events-layout{ align-items:stretch; }
.events-layout .group-section{ min-height:0; }
.events-layout .group-section-body{
  height:300px;
  min-height:300px;
  overflow:hidden;

}
.events-layout .group-section-body .table-scroll{
  width:100%;
  height:100%;

  overflow:auto;
}

@media (max-width:900px){
  .survey-session-summary .info-list{ grid-template-columns:repeat(3,minmax(0,1fr)); }
  .survey-session-summary .info-row:nth-child(4n){ border-right:1px solid var(--border); }
  .survey-session-summary .info-row:nth-child(3n){ border-right:none; }
  .compact-metric-card .info-list{ grid-template-columns:repeat(3,minmax(0,1fr)); }
  .compact-metric-card .info-row:nth-child(4n){ border-right:1px solid var(--border); }
  .compact-metric-card .info-row:nth-child(3n){ border-right:none; }
  .table-content-scroll .group-section-body{ max-height:55vh; }
  .events-layout .group-section-body{ height:280px; min-height:280px; }
}

@media (max-width:560px){
  .survey-session-summary .info-list{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  .survey-session-summary .info-row:nth-child(3n){ border-right:1px solid var(--border); }
  .survey-session-summary .info-row:nth-child(2n){ border-right:none; }
  .compact-metric-card .info-list{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  .compact-metric-card .info-row:nth-child(3n){ border-right:1px solid var(--border); }
  .compact-metric-card .info-row:nth-child(2n){ border-right:none; }
  .table-content-scroll .group-section-body{ max-height:60vh; }
  .events-layout .group-section-body{ height:260px; min-height:260px; }
}

@media (max-width:700px){
  .cashout-actions-panel{ flex-basis:348px; }
  .cashout-actions-table{ width:348px; }
  .cashout-actions-table th,
  .cashout-actions-table td{ width:58px; min-width:58px; max-width:58px; }
}

.info-card h3{

}

.info-list{
  display:flex;

}

.info-row{
  display:grid;
  grid-template-columns:minmax(120px, 42%) minmax(0, 1fr);

.info-row:last-child{

.info-label{
  color:var(--text-dim);

}

.info-value{

.group-stack{

.group-section{

}

.group-section summary{

.group-section summary:hover{

}

.group-section-body{

}

.group-section-body h2{

/* Action tab */
.action-note{
  display:block;
  width:100%;
  min-height:90px;
  resize:vertical;
  margin-bottom:14px;
  padding:10px 12px;
  background:var(--input-bg);

  border-radius:7px;
  color:var(--text);

.action-note:focus{

}

.action-note::placeholder{

}

.action-groups{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));

}

.action-group{
  padding:14px;

  border-radius:8px;
}

.action-group h3{
  margin:0 0 12px;

}

.action-btn{
  max-width:none;
  margin:0 0 9px;
  padding:10px 12px;
}

.action-btn:last-child{
  margin-bottom:0;
}

  .ab-orange{
  background:var(--orange);
  color:var(--button-dark-text);
}

  .ab-purple{
  background:var(--purple);
  border:1px solid var(--pink-border);
  }

  .ab-pink{
  background:var(--pink);
  }

  @media (max-width:700px){
  .info-grid,
  .action-groups{
    grid-template-columns:1fr;
  }

  .info-row{
    grid-template-columns:1fr;
    gap:3px;
  }
  }
  
  table{
    width:100%;
    border-collapse:collapse;
    font-size:12px;
  }
  thead th{
    background:var(--panel-alt);

    border:1px solid var(--border);

<script>
const verificationImages = [
  { src:'./assets/dale-garthwaite.jpg', alt:'Dale Garthwaite verification image' },
  { src:'./assets/aisha-tarrant.jpg', alt:'Aisha Tarrant verification image' }
];
let verificationImageIndex = 0;
const verificationImage = document.getElementById('verificationImage');
const verificationImageIndicator = document.getElementById('verificationImageIndicator');
function showVerificationImage(nextIndex){
  verificationImageIndex = (nextIndex + verificationImages.length) % verificationImages.length;

function syncCashoutScroll(){
  const dataScroll = document.querySelector('.cashout-data-scroll');
  const actionsScroll = document.querySelector('.cashout-actions-scroll');
  const rail = document.querySelector('.cashout-horizontal-rail');
  const thumb = document.querySelector('.cashout-horizontal-thumb');
  if (!dataScroll || !actionsScroll || !rail || !thumb) return;
  const rowCount = document.querySelectorAll('.cashout-data-scroll tbody tr').length;
  const panelHeight = Math.min(330, 42 * (rowCount + 1) + 2);
  dataScroll.style.height = `${panelHeight}px`;
  actionsScroll.style.height = `${panelHeight}px`;
  let syncing = false;
  dataScroll.addEventListener('scroll', () => {
    if (syncing) return;
    syncing = true;
    actionsScroll.scrollTop = dataScroll.scrollTop;
    syncing = false;
  });
  actionsScroll.addEventListener('scroll', () => {
    if (syncing) return;
    syncing = true;
    dataScroll.scrollTop = actionsScroll.scrollTop;
    syncing = false;
  });
  const updateRail = () => {
    const max = dataScroll.scrollWidth - dataScroll.clientWidth;
    const track = rail.clientWidth;
    const thumbWidth = max > 0 ? Math.max(24, track * dataScroll.clientWidth / dataScroll.scrollWidth) : track;
    thumb.style.width = `${thumbWidth}px`;
    thumb.style.transform = `translateX(${max > 0 ? (track - thumbWidth) * dataScroll.scrollLeft / max : 0}px)`;
  };
  dataScroll.addEventListener('scroll', updateRail);
  window.addEventListener('resize', updateRail);
  rail.addEventListener('click', event => {
    if (event.target === thumb) return;
    const max = dataScroll.scrollWidth - dataScroll.clientWidth;
    const track = rail.clientWidth - thumb.offsetWidth;
    dataScroll.scrollLeft = track > 0 ? max * Math.max(0, Math.min(1, (event.offsetX - thumb.offsetWidth / 2) / track)) : 0;
  });
  let dragging = false;
  thumb.addEventListener('pointerdown', event => { dragging = true; thumb.setPointerCapture(event.pointerId); });
  thumb.addEventListener('pointermove', event => {
    if (!dragging) return;
    const max = dataScroll.scrollWidth - dataScroll.clientWidth;
    const track = rail.clientWidth - thumb.offsetWidth;
    dataScroll.scrollLeft = track > 0 ? max * Math.max(0, Math.min(1, (event.offsetX - thumb.offsetWidth / 2) / track)) : 0;
  });
  thumb.addEventListener('pointerup', () => { dragging = false; });
  requestAnimationFrame(updateRail);
}

const COLUMN_ORDER_STORAGE_PREFIX = 'admin-tool-playground:column-order:';

function columnKey(text, occurrence){
  const base = text.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'column';
  return occurrence > 1 ? `${base}-${occurrence}` : base;
}

function tablePreferenceId(table, index){
  const section = table.closest('details')?.querySelector('summary')?.textContent?.trim();
  const kind = table.classList.contains('cashout-actions-table') ? 'cashout-actions' : table.className || 'table';
  return `${section || 'tab'}:${kind}:${index}`.replace(/\s+/g, '-').toLowerCase();
}

function moveTableColumn(table, from, to){
  if (from === to) return;
  const rows = [...table.rows];
  rows.forEach(row => {
    const cells = [...row.children];
    const cell = cells[from];
    row.insertBefore(cell, to > from ? cells[to].nextSibling : cells[to]);
  });
}

function enableColumnReordering(){
  const tables = [...main.querySelectorAll('table')].filter(table => !table.classList.contains('cashout-actions-table'));
  tables.forEach((table, tableIndex) => {
    const headers = [...table.tHead?.rows[0]?.cells || []];
    if (!headers.length) return;
    const occurrences = {};
    headers.forEach(header => {
      const base = header.textContent.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'column';
      occurrences[base] = (occurrences[base] || 0) + 1;
      header.dataset.columnKey = columnKey(header.textContent, occurrences[base]);
      header.draggable = true;
    });
    const preferenceKey = `${COLUMN_ORDER_STORAGE_PREFIX}${tablePreferenceId(table, tableIndex)}`;
    let saved = [];
    try { saved = JSON.parse(localStorage.getItem(preferenceKey) || '[]'); } catch {}
    const current = headers.map(header => header.dataset.columnKey);
    const order = [...saved.filter(key => current.includes(key)), ...current.filter(key => !saved.includes(key))];
    order.forEach((key, position) => {
      const from = [...table.tHead.rows[0].cells].findIndex(cell => cell.dataset.columnKey === key);
      moveTableColumn(table, from, position);
    });
    let draggedKey = null;
    table.tHead.rows[0].addEventListener('dragstart', event => {
      const header = event.target.closest('th[data-column-key]');
      if (!header) return;
      draggedKey = header.dataset.columnKey;
      header.classList.add('column-dragging');
      event.dataTransfer.effectAllowed = 'move';
      event.dataTransfer.setData('text/plain', draggedKey);
    });
    table.tHead.rows[0].addEventListener('dragover', event => {
      const target = event.target.closest('th[data-column-key]');
      if (!target || target.dataset.columnKey === draggedKey) return;
      event.preventDefault();
      table.tHead.rows[0].querySelectorAll('th').forEach(cell => cell.classList.remove('column-drop-before', 'column-drop-after'));
      target.classList.add(event.offsetX < target.offsetWidth / 2 ? 'column-drop-before' : 'column-drop-after');
    });
    table.tHead.rows[0].addEventListener('dragleave', event => {
      if (event.target === table.tHead.rows[0]) table.tHead.rows[0].querySelectorAll('th').forEach(cell => cell.classList.remove('column-drop-before', 'column-drop-after'));
    });
    table.tHead.rows[0].addEventListener('drop', event => {
      event.preventDefault();
      const target = event.target.closest('th[data-column-key]');
      if (!target || target.dataset.columnKey === draggedKey) return;
      const headersNow = [...table.tHead.rows[0].cells];
      const from = headersNow.findIndex(cell => cell.dataset.columnKey === draggedKey);
      let to = headersNow.indexOf(target);
      if (event.offsetX >= target.offsetWidth / 2) to += 1;
      moveTableColumn(table, from, to);
      localStorage.setItem(preferenceKey, JSON.stringify([...table.tHead.rows[0].cells].map(cell => cell.dataset.columnKey)));
    });
    table.tHead.rows[0].addEventListener('dragend', () => {
      draggedKey = null;
      table.tHead.rows[0].querySelectorAll('th').forEach(cell => cell.classList.remove('column-dragging', 'column-drop-before', 'column-drop-after'));
    });
  });
}
